name: Preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx astro check

      - name: Build
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ secrets.PUBLIC_SANITY_DATASET }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
        run: npm run build

      - name: Upload version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          npx wrangler versions upload \
            --tag "pr-$PR_NUMBER" \
            --message "PR #$PR_NUMBER: $PR_TITLE" 2>&1 | tee upload.log

          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' upload.log | head -1)"
          if [ -z "$url" ]; then
            echo "::warning::Upload succeeded but no preview URL was found in the output. Is preview_urls enabled?"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="$(printf '**Preview:** %s\n\nBuilt from `%s`. Production is untouched — merging this PR is what deploys it.' \
            "$URL" "${SHA:0:7}")"
          gh pr comment "$PR_NUMBER" --body "$body" --edit-last --create-if-none \
            || gh pr comment "$PR_NUMBER" --body "$body"
